name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Día 1 de cada mes a las 06:17 UTC (minuto no redondo para evitar colas).
    - cron: '17 6 1 * *'

permissions:
  contents: read

# CodeQL must finish once started: a cancelled analysis uploads an empty SARIF
# and GitHub records it as a failed analysis on the default branch.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Restore
        run: dotnet restore portafolio-backend.sln

      - name: Build
        run: dotnet build portafolio-backend.sln --no-restore --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          fail-on: none

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore portafolio-backend.sln

      - name: List vulnerable packages
        shell: bash
        run: |
          dotnet list portafolio-backend.sln package --vulnerable --include-transitive --no-restore --format json > nuget-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync('nuget-audit.json', 'utf8'));
          } catch {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '### NuGet audit\n\nNo se pudo interpretar el informe JSON.\n'
            );
            process.exit(0);
          }
          const counts = {};
          for (const project of report.projects ?? []) {
            for (const framework of project.frameworks ?? []) {
              const groups = [framework.topLevelPackages ?? [], framework.transitivePackages ?? []];
              for (const group of groups) {
                for (const pkg of group) {
                  for (const vuln of pkg.vulnerabilities ?? []) {
                    const severity = (vuln.severity ?? 'unknown').toLowerCase();
                    counts[severity] = (counts[severity] ?? 0) + 1;
                  }
                }
              }
            }
          }
          const rows = ['critical', 'high', 'moderate', 'low'].map(
            (severity) => `| ${severity} | ${counts[severity] ?? 0} |`
          );
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            ['### NuGet audit', '', '| Severidad | Número |', '| --- | ---: |', ...rows, ''].join('\n')
          );
          NODE

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-audit
          path: nuget-audit.json
          if-no-files-found: warn

  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore portafolio-backend.sln

      - name: Build
        run: dotnet build portafolio-backend.sln --no-restore --configuration Release

      - name: Test
        shell: bash
        run: |
          if [ -n "$(find . -type f -name '*Tests.csproj' -print -quit)" ]; then
            dotnet test portafolio-backend.sln --no-build --configuration Release
          else
            echo "No hay proyectos de prueba (*Tests.csproj); se omiten las pruebas."
            echo "### Tests" >> "$GITHUB_STEP_SUMMARY"
            echo "Omitidos: no hay proyectos de prueba en la solución." >> "$GITHUB_STEP_SUMMARY"
          fi
